name: Build VoxClarity VST3
on:
  workflow_dispatch:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'README.md'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/build-vst3.yml'
permissions:
  contents: read
jobs:
  windows-vst3:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure JUCE and RNNoise project
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DRNNOISE_BUILD_TESTS=OFF -DRNNOISE_BUILD_EXAMPLES=OFF
      - name: Build VST3
        run: cmake --build build --config Release --target VoxClarity_VST3
      - name: Package plugin with license notices
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Directory -Filter 'VoxClarity.vst3' -Recurse | Select-Object -First 1
          if (-not $plugin) { throw 'VoxClarity.vst3 bundle not found' }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse -LiteralPath $plugin.FullName -Destination package
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.md package
          Compress-Archive -Path package/* -DestinationPath VoxClarity-Windows-x64-VST3.zip -Force
      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxClarity-Windows-x64-VST3
          path: VoxClarity-Windows-x64-VST3.zip
          if-no-files-found: error
          retention-days: 30

