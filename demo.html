<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoxClarity — referência visual</title>
<style>
:root{color-scheme:dark;--bg:#10131c;--panel:#191d2b;--line:#34394d;--text:#edf0fa;--muted:#989fb5;--cyan:#69e6ef;--pink:#e84fa8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#26334a,var(--bg) 70%);font:14px/1.45 system-ui,Segoe UI,sans-serif;color:var(--text);display:grid;place-items:center;min-height:100vh}.plugin{width:min(760px,96vw);border:1px solid #41465a;border-radius:22px;padding:28px;background:linear-gradient(145deg,#1b2030,#121520);box-shadow:0 30px 90px #0009;overflow:hidden;position:relative}.plugin:before{content:"";position:absolute;inset:0 0 auto;height:135px;background:linear-gradient(120deg,#45d9e533,#c643a533);pointer-events:none}.head{position:relative;display:flex;justify-content:space-between;align-items:start}.brand{font-weight:750;letter-spacing:.18em;color:var(--cyan);font-size:12px}h1{font-size:28px;margin:4px 0}.sub,.small{color:var(--muted)}.badge{border:1px solid #545b74;border-radius:99px;padding:6px 12px;font-size:10px;letter-spacing:.12em;color:var(--cyan)}.visual{height:205px;display:flex;justify-content:center;align-items:center;position:relative}.orb{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#44415d,#1b1c2d 70%);border:2px solid #59dce4;box-shadow:0 0 32px #d640a755, inset 0 0 24px #69e6ef33;font-size:18px;font-weight:bold}.orb:after{content:"";position:absolute;width:176px;height:176px;border-radius:50%;border:2px solid #e84fa8;opacity:.55}.panel{background:#12151f;border:1px solid var(--line);border-radius:14px;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.control{text-align:center}.knob{width:86px;height:86px;margin:8px auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#36394b,#151824 72%);border:2px solid #697084;box-shadow:0 0 15px #69e6ef33,inset 0 0 12px #000;display:grid;place-items:center;font-size:18px}.control:first-child .knob{border-color:var(--pink);box-shadow:0 0 22px #e84fa855,inset 0 0 12px #000}.label{font-size:10px;letter-spacing:.13em;color:var(--muted)}.switch{display:flex;justify-content:center;align-items:center;gap:8px;color:var(--cyan);font-size:11px;font-weight:bold;margin-top:16px}.pill{width:35px;height:19px;border-radius:12px;background:#4d344b;position:relative}.pill:after{content:"";position:absolute;width:13px;height:13px;right:3px;top:3px;border-radius:50%;background:var(--pink)}footer{font-size:11px;color:var(--muted);text-align:center;margin-top:14px}@media(max-width:560px){.plugin{padding:18px}.grid{grid-template-columns:repeat(2,1fr)}.visual{height:170px}}
</style>
<main class="plugin"><div class="head"><div><div class="brand">VOX / CLARITY</div><h1>Voice cleanup</h1><div class="sub">RNNoise · neural noise suppression</div></div><span class="badge">LIVE · 48 kHz</span></div><div class="visual"><div class="orb">RN</div></div><section class="panel"><div class="grid"><div class="control"><div class="label">STRENGTH</div><div class="knob">72%</div></div><div class="control"><div class="label">MIX</div><div class="knob">100%</div></div><div class="control"><div class="label">VOICE GATE</div><div class="knob">12%</div></div><div class="control"><div class="label">OUTPUT dB</div><div class="knob">0.0</div></div></div><div class="switch"><span class="pill"></span> DIFF · LISTEN REMOVED NOISE</div></section><footer>Concepto visual do plugin · processamento real depende da build VST3</footer></main>
